<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Trade Grid</title>
  <link rel="stylesheet" href="login.css">
</head>

<body>
  <div class="gradient-bg full-height">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <svg width="48" height="48" fill="none" stroke="rgb(190, 195, 175)" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <h1>Welcome Back</h1>
          <p>Sign in to your Trade Grid account</p>
        </div>

        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" name="remember">
              <span>Remember me</span>
            </label>
            <a href="#" class="link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="auth-footer">
          <p>Don't have an account? <a href="onboarding.html" class="link">Sign up</a></p>
        </div>

        <div class="back-link">
          <a href="landing.html" class="link">← Back to home</a>
        </div>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
