<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Companies</title>
    <link rel="stylesheet" href="match.css">
</head>

<body>

    <!-- ✅ HEXAGON BACKGROUND -->
    <!-- Hexagon Background -->
    <div class="hexagon-background">
        <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="hexagons" x="0" y="0" width="100" height="86.6" patternUnits="userSpaceOnUse">
                    <path d="M50 0L93.3 25V75L50 100L6.7 75V25L50 0Z" stroke="#FF6B35" stroke-width="1" fill="none" />
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#hexagons)" />
        </svg>
    </div>


    <!-- ✅ MAIN CONTENT -->
    <div class="discover-page">

        <div class="header">
            <h1>Discover</h1>
            <p id="remaining">10 companies remaining</p>
        </div>

        <div class="card" id="currentCard">
            <img id="companyImg" src="" alt="Industry" class="company-img">
            <h2 id="companyName">Company Name</h2>
            <p id="companyType">Exporter / Importer</p>
            <div id="companyIndustries" class="industries"></div>
        </div>

        <div class="buttons">
            <button id="swipeLeft">❌</button>
            <button id="swipeRight">❤️</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>



    <script src="match.js"></script>
</body>

</html>
