<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speed Date</title>
  <link rel="stylesheet" href="speed-date.css" />
</head>
<body>

<div class="session" id="app">

  <!-- Header -->
  <div class="header">
    <div>
      <div class="header-label">SPEED TRADING SESSION</div>
      <div class="header-title">Live Connections</div>
    </div>
    <div class="header-right">
      <div class="session-timer-wrap">
        <div class="header-label">SESSION ENDS IN</div>
        <div class="session-timer" id="sessionTimer">60:00</div>
      </div>
      <svg class="session-arc-svg" width="60" height="60" viewBox="0 0 60 60">
        <circle cx="30" cy="30" r="25" stroke="rgba(190,195,175,0.1)" stroke-width="3" fill="none"/>
        <circle id="sessionArc" cx="30" cy="30" r="25"
          stroke="rgb(190,195,175)" stroke-width="3" fill="none"
          stroke-linecap="round" stroke-dasharray="157" stroke-dashoffset="157"/>
      </svg>
    </div>
  </div>

  <!-- Session progress bar -->
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="sessionBar"></div>
  </div>

  <!-- Main two-column layout -->
  <div class="main">

    <!-- Left Panel: Match Profile -->
    <div class="panel panel-left">

      <!-- Match countdown -->
      <div class="match-timer-box" id="matchTimerBox">
        <div class="match-sub">
          <span>TIME WITH THIS MATCH</span>
          <span>of 10:00</span>
        </div>
        <div class="match-time" id="matchTimer">10:00</div>
        <div class="match-progress">
          <div class="match-progress-fill" id="matchBar"></div>
        </div>
      </div>

      <!-- Company info -->
      <div class="company-avatar">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="rgb(190,195,175)" stroke-width="1.5">
          <path d="M3 21h18M6 21V7l6-4 6 4v14M9 21v-4h6v4"/>
        </svg>
      </div>

      <div class="company-name" id="companyName"></div>

      <div class="company-meta">
        <span class="badge" id="companyType"></span>
        <span class="company-location">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
            <circle cx="12" cy="9" r="2.5"/>
          </svg>
          <span id="companyCountry"></span>
        </span>
      </div>

      <div class="detail-label">INDUSTRY</div>
      <div class="detail-value" id="companyIndustry"></div>

      <div class="detail-label">KEY PRODUCTS</div>
      <div id="productTags"></div>

      <!-- Actions -->
      <button class="btn btn-primary" id="saveBtn" onclick="toggleSave()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
        Save This Connection
      </button>

      <button class="btn btn-outline" onclick="nextMatch()">
        Skip to Next Match
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
    </div>

    <!-- Right Panel: Video / Messages -->
    <div class="panel panel-right">

      <!-- Mode toggle -->
      <div class="mode-bar">
        <button class="mode-btn active" id="videoBtnTab" onclick="setMode('video')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 10l4.553-2.069A1 1 0 0121 8.87v6.26a1 1 0 01-1.447.9L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
          </svg>
          Video Call
        </button>
        <button class="mode-btn" id="msgBtnTab" onclick="setMode('message')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z"/>
          </svg>
          Messages
        </button>
      </div>

      <!-- Video view -->
      <div class="content-area" id="videoView">
        <div class="video-view">
          <div class="video-avatar">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="rgb(190,195,175)" stroke-width="1.5">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <div class="video-name" id="videoMatchName"></div>

          <div class="video-controls">
            <div class="ctrl-btn" id="micBtn" onclick="toggleMic()" title="Toggle mute">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
                <path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/>
              </svg>
            </div>
            <div class="ctrl-btn" id="vidBtn" onclick="toggleVid()" title="Toggle video">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 10l4.553-2.069A1 1 0 0121 8.87v6.26a1 1 0 01-1.447.9L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
              </svg>
            </div>
            <div class="ctrl-btn hangup" title="End call">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10.68 13.31a16 16 0 003.41 2.6l1.27-1.27a2 2 0 012.11-.45c1.12.45 2.3.78 3.53.98a2 2 0 011.7 1.98V20a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.42 19.42 0 013.07 8.63 2 2 0 015 6.46h2.5a2 2 0 011.98 1.7c.2 1.22.54 2.41.98 3.53a2 2 0 01-.45 2.11l-1.27 1.27"/>
              </svg>
            </div>
          </div>

          <!-- Self preview -->
          <div class="self-preview">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(190,195,175,0.4)" stroke-width="1.5">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <div class="self-label">You</div>
          </div>
        </div>
      </div>

      <!-- Message view -->
      <div class="content-area msg-view" id="msgView" style="display:none;">
        <div class="msg-list" id="msgList"></div>
        <div class="msg-input-row">
          <input
            class="msg-input"
            id="msgInput"
            type="text"
            placeholder="Type your message..."
            onkeydown="if(event.key==='Enter') sendMessage()"
          />
          <button class="send-btn" onclick="sendMessage()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
            Send
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Upcoming matches queue -->
  <div class="upcoming" id="upcomingSection" style="display:none;">
    <div class="header-label">UPCOMING CONNECTIONS</div>
    <div class="upcoming-list" id="upcomingList"></div>
  </div>

</div>

<script src="speed-date.js"></script>
</body>
</html>
