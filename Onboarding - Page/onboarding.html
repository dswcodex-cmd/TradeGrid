<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account - Trade Grid</title>
  <link rel="stylesheet" href="onboarding.css">
</head>
<body>

  <!--hexagon background code -->
  <svg id="hex-canvas" xmlns="http://www.w3.org/2000/svg"></svg>


  <div class="gradient-bg full-height">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <svg width="48" height="48" fill="none" stroke="rgb(190, 195, 175)" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
          <h1>Create Your Profile</h1>
          <p>Tell us about your business to get matched with ideal partners</p>

          <div class="progress-dots">
            <span class="dot active" data-step="1"></span>
            <span class="dot" data-step="2"></span>
            <span class="dot" data-step="3"></span>
          </div>
        </div>

        <form id="onboardingForm" class="auth-form">

          <!-- Step 1: Basic Information -->
          <div class="form-step active" data-step="1">
            <h3 class="step-title">Basic Information</h3>
             <div class="form-group">
              <label for="companyName">Company Name *</label>
              <input type="text" id="companyName" name="companyName" placeholder="Your company name" required />
           
  <label for="email">Email*</label>
              <input type="text" id="email" name="email" placeholder="Please enter your Email" />
 <label for="cipc">CIPC Number*</label>
              <input type="text" id="cipc" name="cipcNumber" placeholder="Please enter your CIPC number" />
 </div>

            <div class="form-group">
              <label for="type">Business Type *</label>
              <select id="type" name="type" required>
                <option value="">Select type</option>
                <option value="importer">Importer</option>
                <option value="exporter">Exporter</option>
              </select>
            </div>

            <div class="form-group">
              <label for="industry">Industry *</label>
              <select id="industry" name="industry" required>
                <option value="">Select industry</option>
                <option value="Electronics">Electronics</option>
                <option value="Food & Beverages">Food &amp; Beverages</option>
                <option value="Textiles & Apparel">Textiles &amp; Apparel</option>
                <option value="Manufacturing & Industrial">Manufacturing &amp; Industrial</option>
                <option value="Healthcare & Pharma">Healthcare &amp; Pharma</option>
                <option value="Renewable Energy">Renewable Energy equipment</option>
              </select>
            </div>

            <div class="form-buttons">
              <button type="button" class="btn-next" onclick="nextStep(2)">Next →</button>
            </div>
          </div>

          <!-- Step 2: Company Details -->
          <div class="form-step" data-step="2">
            <h3 class="step-title">Company Details</h3>

            <div class="form-group">
              <label for="products">Products/Services *</label>
              <input type="text" id="products" name="products" placeholder="e.g., Electronics, Semiconductors, Circuit Boards" required />
              <small>Separate multiple products with commas</small>
            </div>

            <div class="form-group">
              <label for="yearEstablished">Year Established *</label>
              <input type="date" id="yearEstablished" name="yearEstablished" required />
            </div>

            <div class="form-group">
              <label for="employees">Number of Employees *</label>
              <select id="employees" name="employees" required>
                <option value="">Select range</option>
                <option value="1-20">1-20</option>
                <option value="20-50">20-50</option>
                <option value="50-100">50-100</option>
                <option value="100-200">100-200</option>
                <option value="200-500">200-500</option>
                <option value="500-1000">500-1000</option>
                <option value="1000+">1000+</option>
              </select>
            </div>

            <div class="form-group">
              <label for="description">Company Description *</label>
              <textarea id="description" name="description" rows="3" placeholder="Brief description of your business..." required></textarea>
            </div>

            <div class="form-group">
              <label for="lookingFor">What are you looking for? *</label>
              <textarea id="lookingFor" name="lookingFor" rows="3" placeholder="Brief description of what you're looking for..." required></textarea>
            </div>

            <div class="form-buttons">
              <button type="button" class="btn-back" onclick="prevStep(1)">← Back</button>
              <button type="button" class="btn-next" onclick="nextStep(3)">Next →</button>
            </div>
          </div>

          <!-- Step 3: Trading Preferences -->
          <div class="form-step" data-step="3">
            <h3 class="step-title">Trading Preferences</h3>

            <div class="form-group">
              <label>Target COuntries</label>
              <div class="checkbox-group">
                <label class="checkbox-label"><input type="checkbox" name="regions" value="Gauteng" /></span>South Africa</span></label>
                <label class="checkbox-label"><input type="checkbox" name="regions" value="KwaZulu-Natal" /><span>Netherlands</span></label>
                <label class="checkbox-label"><input type="checkbox" name="regions" value="Western Cape" /></span>India</span></label>
                <label class="checkbox-label"><input type="checkbox" name="regions" value="Eastern Cape" /><span>Australia</span></label>
                <label class="checkbox-label"><input type="checkbox" name="regions" value="Northern Cape" /><span>Germany</span></label>
                <label class="checkbox-label"><input type="checkbox" name="regions" value="Free State" /><span>New Zealand</span></label>
                <label class="checkbox-label"><input type="checkbox" name="regions" value="Limpopo" /><span>Denmark</span></label>
                <!---
                <label class="checkbox-label"><input type="checkbox" name="regions" value="Mpumalanga" /><span>Mpumalanga</span></label>
                <label class="checkbox-label"><input type="checkbox" name="regions" value="North West" /><span>North West</span></label>
              -->
              </div>
            </div>

            <div class="form-group">
             <label for="cipc">CIPC Number</label>
              <input type="text" id="cipc" name="cipcNumber" placeholder="Please enter your CIPC number" />
             
               <label for="password">Password</label>
<div style="position: relative; display: inline-block;">
  <input type="password" id="password" name="password" placeholder="Please enter your password" />
  <button type="button" onclick="togglePassword('password', this)">Show</button>
</div>

<label for="password-confirm">Confirm Password</label>
<div style="position: relative; display: inline-block;">
  <input type="password" id="password-confirm" name="password-confirm" placeholder="Please confirm your password" />
  <button type="button" onclick="togglePassword('password-confirm', this)">Show</button>
</div>
              
              
            </div>

            <div class="form-buttons">
              <button type="button" class="btn-back" onclick="prevStep(2)">← Back</button>
              <button type="submit" class="btn-submit">Complete Registration</button>
            </div>
          </div>

        </form>

        <div class="back-link">
          <a href="../New Landing - Page/landing.html" class="link">← Back to home</a>
        </div>
      </div>
    </div>
  </div>

  
</body>
<script src="onbaording.js"></script>
</html>
